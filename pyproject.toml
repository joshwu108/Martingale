[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "martingale"
version = "0.2.0"
description = "Exact off-policy staleness accounting for asynchronous policy-gradient RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["reinforcement-learning", "rlhf", "grpo", "ppo", "importance-sampling", "provenance", "async-rl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
campaigns = [
    "torch>=2.0",
    "numpy>=1.26",
]
prod = [
    "torch>=2.0",
    "prometheus-client>=0.20",
    "click>=8.0",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "torch>=2.0",
    "prometheus-client>=0.20",
    "click>=8.0",
]

[project.scripts]
martingale = "martingale.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "torch>=2.0",
    "prometheus-client>=0.20",
    "click>=8.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.hatch.build.targets.wheel]
packages = ["src/martingale", "checker"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
