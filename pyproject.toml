[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "martingale"
version = "0.1.0"
description = "Exact off-policy staleness accounting for asynchronous policy-gradient RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
campaigns = [
    "torch>=2.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.hatch.build.targets.wheel]
packages = ["src/martingale"]
